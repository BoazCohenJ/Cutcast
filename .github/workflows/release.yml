name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --publish never

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Cutcast.Setup.${{ steps.version.outputs.version }}.exe
            release/Cutcast.${{ steps.version.outputs.version }}.exe
          fail_on_unmatched_files: true
